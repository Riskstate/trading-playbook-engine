[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "riskstate-trading-playbook"
version = "0.2.0"
description = "Python client for the RiskState Trading Playbook Engine — a registry of locked crypto trading setups and which fire now for BTC/USD and ETH/USD, gated by structure + risk (the strategist engine). Public, no key."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "RiskState" }]
keywords = ["crypto", "bitcoin", "ethereum", "trading", "trading-strategy", "playbook", "risk-management", "riskstate"]
dependencies = []

[project.urls]
Homepage = "https://riskstate.ai/docs/playbook-engine"
Repository = "https://github.com/Riskstate/trading-playbook-engine"
"Bug Tracker" = "https://github.com/Riskstate/trading-playbook-engine/issues"

[tool.setuptools]
packages = ["riskstate_trading_playbook"]
